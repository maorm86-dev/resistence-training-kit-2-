const c=cardsOf().find(k=>k[1]===stq.textContent);if(!c)return;
const st=stq.closest('.stage'),ans=$('#ans');
ans.insertAdjacentHTML('beforebegin','<textarea class="tp" id="tp" placeholder="הקלד/י כאן את התשובה מהזיכרון – אחר כך נשווה אותה לתשובה הנכונה…"></textarea>');
sh.textContent='השווה לתשובה הנכונה';
$('#tp').focus({preventScroll:true});
const fin=(pct)=>{const sug=pct==null?'':pct>=60?'y':'n';$('#fb').innerHTML=`<button class="bt no${sug=='n'?' sug':''}" id="n">לא ידעתי → קופסה 1</button><button class="bt ok${sug=='y'?' sug':''}" id="y">ידעתי ↑</button>`;
$('#n').onclick=()=>{K[c[0]]=1;sv();leit()};$('#y').onclick=()=>{K[c[0]]=bx(c)>=3?4:bx(c)+1;sv();leit()}};
sh.onclick=()=>{const u=$('#tp').value.trim();
if(!u){ans.innerHTML=`<div class="a">${esc(c[2])}</div><p><small>לא הקלדת תשובה – נסו להקליד בפעם הבאה; כתיבה מחזקת זיכרון הרבה יותר מקריאה.</small></p>`;fin(null);return}
const r=cmpAns(u,c[2]);
ans.innerHTML=`<div class="cov" title="${r.pct}%"><i style="width:${r.pct}%"></i></div><p style="margin:6px 0"><b>כיסית כ-${r.pct}%</b> מנקודות המפתח <small>(בדיקה לפי מילות מפתח – את/ה שופט/ת סופי/ת)</small></p><div class="cmp"><div><h5>✍️ התשובה שלך</h5>${esc(u)}</div><div><h5>✅ התשובה הנכונה</h5>${r.html}</div></div><p><small><span class="hit">ירוק</span> = כיסית · <span class="miss">אדום</span> = חסר</small></p>`;
$('#tp').disabled=true;fin(r.pct)}};

draw();
</script></body></html>
